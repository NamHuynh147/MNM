{% extends "base.html" %}

{% block title %}Danh sách thiệp{% endblock %}

{% block content %}
<!-- Hero Section -->
  <section class="hero">
    <h1>Tạo thiệp mời đẹp trong vài phút</h1>
    <p>Chọn mẫu, chỉnh sửa dễ dàng, chia sẻ ngay lập tức.</p>
    <button class="btn-primary">Bắt đầu thiết kế</button>
  </section>

  <!-- Showcase Section -->
  <section class="showcase">
    <h2>Mẫu thiệp nổi bật</h2>
    <div class="card-container">
      <div class="card">
        <img src="{{ url_for('static', filename='images/wedding.jpg') }}" alt="Thiệp cưới">
        <p>Thiệp cưới</p>
      </div>
      <div class="card">
        <img src="{{ url_for('static', filename='images/birthday.jpg') }}" alt="Thiệp sinh nhật">
        <p>Thiệp sinh nhật</p>
      </div>
      <div class="card">
        <img src="{{ url_for('static', filename='images/event.jpg') }}" alt="Thiệp sự kiện">
        <p>Thiệp sự kiện</p>
      </div>
    </div>
  </section>

  <!-- CTA Section -->
  <section class="cta">
    <h2>Thiết kế thiệp mời của riêng bạn</h2>
    <button class="btn-secondary">Khám phá thêm</button>
  </section>
{% endblock %}
