<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Thiệp mời online{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <!-- Header -->
    <header>
        <h1> Thiệp Mời Online </h1>
        <nav>
            <a href="{{ url_for('auth.login') }}">Đăng nhập</a>
            <a href="{{ url_for('auth.register') }}">Đăng ký</a> 
            <a href="{{ url_for('card.list') }}">Danh sách thiệp</a> 
        </nav>
    </header>

    <!-- Nội dung riêng -->
    <main>
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 Thiệp Mời Online</p>
    </footer>
</body>
</html>
